allowBuilds:
  esbuild: true
  unrs-resolver: true

autoInstallPeers: true

blockExoticSubdeps: true

dangerouslyAllowAllBuilds: false

enablePrePostScripts: true

engineStrict: true

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExcludePrune: true

minimumReleaseAgeStrict: true

overrides:
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  uuid@<11.1.1: ^11.1.1

strictDepBuilds: true

strictStorePkgContentCheck: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - webpack-dev-middleware@7.4.6

trustPolicyExcludePrune: true

trustPolicyIgnoreAfter: 525600 # 1 year

update:
  githubActions: true

verifyStoreIntegrity: true
